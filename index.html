<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06152d">
<title>Echo 5 Clock & Weather</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06152d;color:#fff;font-family:Arial,Helvetica,sans-serif}
  body{position:relative}
  .bg{position:absolute;inset:0;background:url('hero.jpg') center/cover no-repeat;filter:saturate(1.05) contrast(1.03)}
  .vignette{position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,9,24,.05) 0%,rgba(1,9,24,.05) 50%,rgba(2,13,35,.25) 61%,rgba(2,13,35,.35) 100%);pointer-events:none}
  .leftPanel{position:absolute;left:0;bottom:0;width:60%;height:43%;background:linear-gradient(180deg,rgba(2,12,29,.18),rgba(2,12,29,.92) 34%,rgba(2,12,29,.98));padding:18px 26px 20px;display:flex;flex-direction:column;justify-content:flex-end}
  .rightPanel{position:absolute;right:0;top:0;width:43%;height:100%;background:linear-gradient(90deg,rgba(5,23,51,.60),rgba(4,20,46,.78));border-left:1px solid rgba(255,255,255,.72);padding:26px 28px 22px;display:flex;flex-direction:column;justify-content:center;text-shadow:0 2px 5px rgba(0,0,0,.45)}
  .timeRow{display:flex;align-items:flex-end;gap:8px;white-space:nowrap}
  #time{font-weight:800;font-size:clamp(76px,15vw,122px);line-height:.78;letter-spacing:-5px;text-shadow:0 3px 9px rgba(0,0,0,.62)}
  #ampm{font-weight:700;font-size:clamp(24px,4.8vw,40px);padding-bottom:5px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #date{margin-top:15px;font-weight:800;font-size:clamp(25px,4.3vw,38px);line-height:1.02;text-shadow:0 2px 6px rgba(0,0,0,.65)}
  .weatherTop{display:flex;align-items:center;gap:10px}
  #icon{font-size:clamp(58px,8.8vw,84px);line-height:1;min-width:82px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  #temp{font-size:clamp(70px,11.5vw,108px);font-weight:800;line-height:.86;letter-spacing:-4px}
  #condition{font-size:clamp(27px,4.3vw,40px);font-weight:800;margin-top:8px}
  #feels,#humidity{font-size:clamp(19px,3vw,28px);font-weight:500;line-height:1.18;margin-top:4px}
  .rule{height:1px;background:rgba(255,255,255,.78);margin:18px 0 14px}
  .bottomWeather{font-size:clamp(20px,3.25vw,30px);font-weight:600;line-height:1.25}
  #rain{margin-top:4px}
  #wakeButton{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.84);color:#fff;border-radius:18px;padding:8px 15px;font-size:14px}
  #error{display:none;position:absolute;right:12px;bottom:8px;z-index:8;font-size:11px;background:rgba(0,0,0,.65);padding:4px 7px;border-radius:8px}
  @media (max-width:700px){
    .leftPanel{width:61%;height:44%;padding:15px 18px 16px}
    .rightPanel{width:42%;padding:20px 18px 17px}
    #icon{min-width:64px}
  }
</style>
</head>
<body>
<div class="bg"></div><div class="vignette"></div>
<section class="leftPanel">
  <div class="timeRow"><span id="time">--:--</span><span id="ampm"></span></div>
  <div id="date">Loading…</div>
</section>
<section class="rightPanel">
  <div class="weatherTop"><div id="icon">☀️</div><div id="temp">--°C</div></div>
  <div id="condition">Loading weather…</div>
  <div id="feels">Feels like --°</div>
  <div id="humidity">Humidity --%</div>
  <div class="rule"></div>
  <div class="bottomWeather"><div id="highlow">H --° &nbsp;·&nbsp; L --°</div><div id="rain">Rain --%</div></div>
</section>

<script>
(()=>{
'use strict';
// Hidden weather location for ZIP 17112 / Harrisburg area. Not displayed on screen.
const LAT=40.37497, LON=-76.77163, TZ='America/New_York';
const $=id=>document.getElementById(id);
function updateClock(){
  const now=new Date();
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(now);
  $('time').textContent=`${parts.find(p=>p.type==='hour')?.value||''}:${parts.find(p=>p.type==='minute')?.value||''}`;
  $('ampm').textContent=parts.find(p=>p.type==='dayPeriod')?.value||'';
  $('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric'}).format(now);
}
function wx(code){const t={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Fog'],48:['🌫️','Freezing fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],61:['🌦️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['❄️','Snow grains'],80:['🌦️','Rain showers'],81:['🌧️','Rain showers'],82:['⛈️','Heavy showers'],85:['🌨️','Snow showers'],86:['❄️','Heavy snow showers'],95:['⛈️','Thunderstorms'],96:['⛈️','Thunderstorms'],99:['⛈️','Thunderstorms']};return t[code]||['🌡️','Current weather']}
const round=v=>Number.isFinite(v)?Math.round(v):'--';
async function updateWeather(){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
    `&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m`+
    `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max`+
    `&temperature_unit=celsius&timezone=${encodeURIComponent(TZ)}&forecast_days=1`;
  try{
    const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const d=await res.json(); const [icon,text]=wx(d.current.weather_code);
    $('icon').textContent=icon; $('temp').textContent=`${round(d.current.temperature_2m)}°C`; $('condition').textContent=text;
    $('feels').textContent=`Feels like ${round(d.current.apparent_temperature)}°`; $('humidity').textContent=`Humidity ${round(d.current.relative_humidity_2m)}%`;
    $('highlow').textContent=`H ${round(d.daily.temperature_2m_max[0])}°  ·  L ${round(d.daily.temperature_2m_min[0])}°`; $('rain').textContent=`Rain ${round(d.daily.precipitation_probability_max[0])}%`;
    $('error').style.display='none';
  }catch(e){$('condition').textContent='Weather unavailable'; $('error').textContent='Weather update failed'; $('error').style.display='block'}
}
async function keepAwake(){const a=$('keepAlive');try{a.volume=.01;await a.play();$('wakeButton').style.display='none'}catch(e){$('wakeButton').style.display='block'}if('wakeLock'in navigator){try{await navigator.wakeLock.request('screen')}catch(_){}}}
$('wakeButton').addEventListener('click',keepAwake);document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});
updateClock();updateWeather();keepAwake();setInterval(updateClock,1000);setInterval(updateWeather,15*60*1000);
})();
</script>
