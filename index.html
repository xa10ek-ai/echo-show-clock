<title>Echo Show 5 Approved Live Clock v18</title>
<!-- Approved master build v17: visual layout held to approved reference; live values only. -->
<style>
:root{--s:1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center;color:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#stage{position:relative;width:calc(960px * var(--s));height:calc(480px * var(--s));overflow:hidden;flex:none;background:#07182b}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;user-select:none;-webkit-user-drag:none}
/* Only a subtle natural darkening behind live text; no bar or strip. */
#shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(2,13,29,0) 0%,rgba(2,13,29,0) 55%,rgba(2,13,29,.16) 64%,rgba(2,13,29,.42) 78%,rgba(2,13,29,.68) 100%)}
#clock{position:absolute;z-index:2;left:calc(42px * var(--s));bottom:calc(26px * var(--s));width:calc(515px * var(--s));text-shadow:0 calc(2px * var(--s)) calc(3px * var(--s)) rgba(0,0,0,.92),0 0 calc(7px * var(--s)) rgba(0,0,0,.52)}
#timeRow{display:flex;align-items:flex-end;gap:calc(8px * var(--s));white-space:nowrap;line-height:.82}
#time{font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:calc(120px * var(--s));font-weight:900;letter-spacing:calc(-6px * var(--s));font-variant-numeric:tabular-nums}
#ampm{font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:calc(36px * var(--s));font-weight:900;line-height:1;padding-bottom:calc(11px * var(--s))}
#date{margin-top:calc(14px * var(--s));font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:calc(32px * var(--s));font-weight:900;line-height:1.03;white-space:nowrap}
#weather{position:absolute;z-index:2;left:calc(644px * var(--s));right:calc(7px * var(--s));bottom:calc(26px * var(--s));height:calc(137px * var(--s));text-shadow:0 calc(2px * var(--s)) calc(3px * var(--s)) rgba(0,0,0,.92),0 0 calc(7px * var(--s)) rgba(0,0,0,.50)}
#weatherMain{display:flex;align-items:center;justify-content:center;gap:calc(9px * var(--s));height:calc(82px * var(--s))}
#icon{width:calc(78px * var(--s));height:calc(78px * var(--s));display:flex;align-items:center;justify-content:center;font-size:calc(74px * var(--s));line-height:1;filter:drop-shadow(0 calc(2px * var(--s)) calc(3px * var(--s)) rgba(0,0,0,.25))}
#tempBlock{text-align:center}
#tempRow{display:flex;align-items:flex-start;justify-content:center;white-space:nowrap;line-height:.82}
#temperature{font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:calc(80px * var(--s));font-weight:900;letter-spacing:calc(-4px * var(--s));font-variant-numeric:tabular-nums}
#unit{font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:calc(28px * var(--s));font-weight:900;padding-top:calc(2px * var(--s));margin-left:calc(2px * var(--s))}
#condition{font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:calc(27px * var(--s));font-weight:900;line-height:1;margin-top:calc(1px * var(--s));white-space:nowrap}
#summary{margin-top:calc(11px * var(--s));display:flex;align-items:center;justify-content:center;gap:calc(9px * var(--s));font-size:calc(21px * var(--s));font-weight:800;white-space:nowrap}
#summary .dot{font-size:.78em;opacity:.95}
#wake{display:none;position:absolute;z-index:5;left:50%;bottom:calc(8px * var(--s));transform:translateX(-50%);background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.55);border-radius:calc(18px * var(--s));color:#fff;font-size:calc(14px * var(--s));padding:calc(7px * var(--s)) calc(13px * var(--s));white-space:nowrap}
#status{position:absolute;z-index:4;right:calc(7px * var(--s));top:calc(5px * var(--s));font-size:calc(10px * var(--s));opacity:.48}
</style>
</head>

function resize(){var s=Math.min(innerWidth/960,innerHeight/480);document.documentElement.style.setProperty('--s',String(s));}
var cf=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true});
var df=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric'});
function updateClock(){var p=cf.formatToParts(new Date()),h='',m='',ap='';p.forEach(function(x){if(x.type==='hour')h=x.value;if(x.type==='minute')m=x.value;if(x.type==='dayPeriod')ap=x.value});$('time').textContent=h+':'+m;$('ampm').textContent=ap;$('date').textContent=df.format(new Date());}
function desc(c){var t={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Freezing fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};return t[c]||'Conditions';}
function ico(c){if(c===0)return '☀️';if(c===1)return '🌤️';if(c===2)return '⛅';if(c===3)return '☁️';if(c===45||c===48)return '🌫️';if((c>=51&&c<=67)||(c>=80&&c<=82))return '🌧️';if((c>=71&&c<=77)||c===85||c===86)return '❄️';if(c>=95)return '⛈️';return '🌡️';}
function rnd(v){return typeof v==='number'&&isFinite(v)?Math.round(v):'--';}
async function weather(){
 var url='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=celsius&timezone='+encodeURIComponent(TZ)+'&forecast_days=1';
 try{var r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);var d=await r.json(),c=d.current,day=d.daily;$('icon').textContent=ico(c.weather_code);$('temperature').textContent=rnd(c.temperature_2m);$('condition').textContent=desc(c.weather_code);$('high').textContent='H '+rnd(day.temperature_2m_max[0])+'°';$('low').textContent='L '+rnd(day.temperature_2m_min[0])+'°';$('rain').textContent='Rain '+rnd(day.precipitation_probability_max[0])+'%';$('status').textContent='';lastWeather=Date.now();}
 catch(e){$('status').textContent='Weather offline';}
}
async function keepAwake(){
  var a=$('keepAlive');
  try{
    a.volume=.01;
    a.loop=true;
    if(a.paused) await a.play();
    $('wake').style.display='none';
  }catch(e){
    $('wake').style.display='block';
  }
  if('wakeLock' in navigator){
    try{await navigator.wakeLock.request('screen');}catch(e){}
  }
}
function ensureKeepAlive(){
  var a=$('keepAlive');
  if(!document.hidden && (a.paused || a.ended)) keepAwake();
}
$('wake').addEventListener('click',keepAwake);
document.addEventListener('click',function(){keepAwake();},{once:true});
document.addEventListener('visibilitychange',function(){if(!document.hidden){keepAwake();if(Date.now()-lastWeather>900000)weather();}});
window.addEventListener('pageshow',keepAwake);
window.addEventListener('focus',keepAwake);
$('keepAlive').addEventListener('ended',keepAwake);
addEventListener('resize',resize);
setInterval(ensureKeepAlive,20000);
resize();updateClock();weather();keepAwake();setInterval(updateClock,1000);setInterval(weather,900000);
})();
</script>
</body>
</html>
