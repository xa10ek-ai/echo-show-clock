<title>Photo Clock - corrected v6</title>
<!-- Version 6: text-free embedded photograph; all visible numbers are live HTML.
     The weather coordinates below remain readable in the public page source.
     They are not displayed on the clock. This is not a private backend. -->
<style>
:root{--u:1;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071728}
body{display:flex;align-items:center;justify-content:center;color:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
#stage{position:relative;width:calc(960px * var(--u));height:calc(480px * var(--u));flex:none;overflow:hidden;background:#071728;isolation:isolate}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:-1;user-select:none;-webkit-user-drag:none}
/* The photograph has no baked-in lettering, weather symbols or mock-up bezel. */
#clock{position:absolute;left:calc(30px * var(--u));right:calc(382px * var(--u));bottom:calc(24px * var(--u))}
#timeRow{display:flex;align-items:baseline;gap:calc(9px * var(--u));white-space:nowrap;line-height:.94}
#time{font-size:calc(130px * var(--u));font-weight:700;letter-spacing:calc(-5px * var(--u));font-variant-numeric:tabular-nums}
#ampm{font-size:calc(36px * var(--u));font-weight:700;letter-spacing:0}
#date{margin-top:calc(12px * var(--u));font-size:calc(30px * var(--u));font-weight:700;line-height:1.12;white-space:nowrap}
#weather{position:absolute;left:calc(608px * var(--u));right:calc(24px * var(--u));bottom:calc(23px * var(--u));height:calc(141px * var(--u));padding-left:calc(22px * var(--u));border-left:calc(1px * var(--u)) solid #80909f;display:flex;flex-direction:column;justify-content:center}
#weatherMain{display:flex;align-items:center;justify-content:center;gap:calc(10px * var(--u));min-height:0}
#weatherIcon{width:calc(79px * var(--u));height:calc(79px * var(--u));flex:none}
#weatherIcon svg{display:block;width:100%;height:100%}
#tempBlock{min-width:0;text-align:center}
#tempRow{display:flex;align-items:flex-start;justify-content:center;white-space:nowrap;line-height:.93}
#temperature{font-size:calc(83px * var(--u));font-weight:700;letter-spacing:calc(-3px * var(--u));font-variant-numeric:tabular-nums}
#unit{font-size:calc(30px * var(--u));font-weight:700;padding-top:calc(4px * var(--u));margin-left:calc(2px * var(--u))}
#condition{font-size:calc(25px * var(--u));font-weight:700;line-height:1.12;margin-top:calc(3px * var(--u));white-space:nowrap}
#summary{display:flex;align-items:center;justify-content:center;gap:calc(8px * var(--u));font-size:calc(22px * var(--u));line-height:1.1;margin-top:calc(14px * var(--u));white-space:nowrap}
#summary .dot{color:#8e9eaf;font-size:.7em}
#extra{display:none}
#status{position:absolute;left:calc(620px * var(--u));right:calc(24px * var(--u));bottom:calc(5px * var(--u));font-size:calc(12px * var(--u));text-align:right;color:#fac98c;white-space:nowrap}
#menuToggle{position:absolute;top:calc(6px * var(--u));right:calc(8px * var(--u));width:calc(44px * var(--u));height:calc(34px * var(--u));font-size:calc(26px * var(--u));line-height:1;background:rgba(7,23,40,.40);border:0;border-radius:calc(8px * var(--u));opacity:.6}
#menu{position:absolute;right:calc(10px * var(--u));top:calc(48px * var(--u));max-width:90%;background:#132940;border:1px solid #708398;padding:calc(12px * var(--u));border-radius:calc(10px * var(--u));z-index:5;font-size:calc(19px * var(--u));box-shadow:0 2px 8px #071728}
#menu button{display:block;border:1px solid #8b9aad;border-radius:calc(6px * var(--u));padding:calc(9px * var(--u)) calc(14px * var(--u));margin-bottom:calc(8px * var(--u));background:#263f58;width:100%;text-align:left}
#menu p{font-size:calc(13px * var(--u));margin:calc(6px * var(--u)) 0 0;line-height:1.4}
#menu a{color:#b5d7fb}
#start{position:absolute;left:50%;top:calc(12px * var(--u));transform:translateX(-50%);font-size:calc(19px * var(--u));padding:calc(10px * var(--u)) calc(18px * var(--u));border:1px solid #c3cfda;border-radius:calc(9px * var(--u));background:rgba(7,23,40,.92);z-index:4;white-space:nowrap}
/* A one-tap no-photo option restores the high-contrast clock arrangement. */
#stage.plain #photo{display:none}
#stage.plain{background:linear-gradient(130deg,#182838,#0c1926)}
#stage.plain #clock{bottom:auto;top:calc(168px * var(--u));right:calc(394px * var(--u))}
#stage.plain #weather{top:calc(56px * var(--u));bottom:calc(40px * var(--u));height:auto;left:calc(584px * var(--u));padding-left:calc(22px * var(--u))}
#stage.plain #extra{display:block;font-size:calc(25px * var(--u));margin-top:calc(24px * var(--u));line-height:1.45}
#stage.plain #summary{margin-top:calc(18px * var(--u))}
</style>

<script>
(function(){
'use strict';
var VERSION='6';
// Retain the already selected weather area. These settings are public source,
// but no city, ZIP code, coordinates or address is rendered on the display.
var LAT=40.37497,LON=-76.77163,TZ='America/New_York';
var REFRESH_MS=15*60*1000,lastSuccess=0,lastData=null,busy=false,lock=null;
var $=function(id){return document.getElementById(id)};
var clockFormat=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true});
var dateFormat=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric'});
var lastMinute='';
function resize(){
 var u=Math.min(window.innerWidth/960,window.innerHeight/480);
 document.documentElement.style.setProperty('--u',String(u));
 fitText();
}
function fit(el,max,min,width){
 var u=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||1;
 var size=max;el.style.fontSize=(size*u)+'px';
 while(el.scrollWidth>width+1&&size>min){size-=.5;el.style.fontSize=(size*u)+'px'}
}
function fitText(){
 if(!$('date'))return;
 fit($('date'),30,22,$('clock').clientWidth);
 var available=$('weather').clientWidth-parseFloat(getComputedStyle($('weather')).paddingLeft);
 fit($('summary'),22,17,available);
 fit($('condition'),25,17,$('tempBlock').clientWidth);
 // The minute count and negative temperatures must not push beyond their panels.
 var u=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||1;
 fit($('time'),130,106,$('clock').clientWidth-$('ampm').offsetWidth-9*u);
 fit($('temperature'),83,62,available-($('weatherIcon').offsetWidth+10*u)-$('unit').offsetWidth-2*u);
}
function updateClock(){
 var now=new Date(),parts=clockFormat.formatToParts(now),hour='',minute='',period='';
 parts.forEach(function(p){if(p.type==='hour')hour=p.value;if(p.type==='minute')minute=p.value;if(p.type==='dayPeriod')period=p.value});
 var next=hour+':'+minute+' '+period;
 if(next!==lastMinute){$('time').textContent=hour+':'+minute;$('ampm').textContent=period;$('date').textContent=dateFormat.format(now);lastMinute=next;fitText()}
}
function round(v){return typeof v==='number'&&isFinite(v)?String(Math.round(v)):'--'}
function description(code){
 var t={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Freezing fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
 return t[code]||'Conditions';
}
function icon(code,isDay){
 var sunny=code===0||code===1,partial=code===2;
 var sun='<g fill="#ffc528"><path d="M50 2l8 20H42zM50 98l-8-20h16zM2 50l20-8v16zM98 50l-20 8V42zM16 16l21 8-13 13zM84 84l-21-8 13-13zM84 16l-8 21-13-13zM16 84l8-21 13 13z"/><circle cx="50" cy="50" r="29" fill="url(#sunFill)" stroke="#eaa500" stroke-width="1"/></g>';
 var moon='<path fill="#e8f3ff" d="M67 8C36 3 9 31 16 61c7 31 40 43 65 25-31 0-53-21-53-45 0-17 18-29 39-33z"/>';
 var cloud='<path d="M26 75C12 75 4 66 4 55C4 43 12 34 25 34C29 14 47 7 63 17C70 21 74 27 76 35C89 32 98 43 98 55C98 68 89 75 77 75Z" fill="url(#cloudFill)" stroke="#aac4d3" stroke-width="1.2"/>';
 var body='';
 if(sunny)body=isDay?sun:moon;
 else if(partial)body='<g transform="translate(-2,-7) scale(.76)">'+(isDay?sun:moon)+'</g><g transform="translate(16,30) scale(.8)">'+cloud+'</g>';
 else if(code===3)body=cloud;
 else if(code===45||code===48)body=cloud+'<path d="M12 82h77M5 93h78" stroke="#d8e6ef" stroke-width="4" stroke-linecap="round"/>';
 else if((code>=71&&code<=77)||code===85||code===86)body='<g transform="translate(0,-9)">'+cloud+'</g><g stroke="#e4f7ff" stroke-width="3"><path d="M28 74v23m-10-17l20 12m0-12L18 92M72 74v23m-10-17l20 12m0-12L62 92"/></g>';
 else if(code>=95)body='<g transform="translate(0,-8)">'+cloud+'</g><path d="M53 61L32 86h17l-5 14 27-27H53z" fill="#ffe04c"/>';
 else if(code>=51)body='<g transform="translate(0,-11)">'+cloud+'</g><path d="M26 72l-7 15M51 76l-7 15M76 72l-7 15" stroke="#58cdfc" stroke-width="5" stroke-linecap="round"/>';
 else body=cloud;
 return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="sunFill" cx=".34" cy=".3" r=".8"><stop stop-color="#fff370"/><stop offset="1" stop-color="#ffbd15"/></radialGradient><linearGradient id="cloudFill" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#c6e0ee"/></linearGradient></defs>'+body+'</svg>';
}
function showWeather(d){
 if(!d||!d.current||!d.daily||typeof d.current.temperature_2m!=='number')throw new Error('Missing current weather');
 var c=d.current,day=d.daily;
 $('temperature').textContent=round(c.temperature_2m);
 $('condition').textContent=description(c.weather_code);
 $('weatherIcon').innerHTML=icon(c.weather_code,c.is_day!==0);
 $('high').textContent='H '+round(day.temperature_2m_max[0])+'\u00b0';
 $('low').textContent='L '+round(day.temperature_2m_min[0])+'\u00b0';
 $('rain').textContent='Rain '+round(day.precipitation_probability_max[0])+'%';
 $('feels').textContent='Feels like '+round(c.apparent_temperature)+'\u00b0';
 $('humidity').textContent='Humidity '+round(c.relative_humidity_2m)+'%';
 fitText();
}
async function updateWeather(){
 if(busy)return;busy=true;
 var controller=typeof AbortController!=='undefined'?new AbortController():null;
 var timeout=controller?setTimeout(function(){controller.abort()},15000):null;
 var url='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+
 '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,is_day'+
 '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max'+
 '&temperature_unit=celsius&timezone='+encodeURIComponent(TZ)+'&forecast_days=1';
 try{
  var opts={cache:'no-store'};if(controller)opts.signal=controller.signal;
  var res=await fetch(url,opts);if(!res.ok)throw new Error('Weather HTTP '+res.status);
  var d=await res.json();showWeather(d);lastData=d;lastSuccess=Date.now();$('status').textContent='';
 }catch(e){
  if(lastData){$('status').textContent='Offline - last weather update '+clockFormat.format(new Date(lastSuccess))}
  else{$('temperature').textContent='--';$('condition').textContent='Weather offline';$('status').textContent='Check Internet / retry from options';fitText()}
 }finally{busy=false;if(timeout)clearTimeout(timeout)}
}
async function wake(){
 try{await $('keepAlive').play();$('start').hidden=true}catch(e){$('start').hidden=false}
 if('wakeLock' in navigator&&!lock){try{lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',function(){lock=null})}catch(e){}}
}
function fullscreen(){
 var s=document.documentElement,fn=s.requestFullscreen||s.webkitRequestFullscreen;
 if(fn){try{var p=fn.call(s);if(p&&p.catch)p.catch(function(){})}catch(e){}}
}
function start(){fullscreen();wake()}
$('keepAlive').volume=.01;
$('start').addEventListener('click',start);
function closeMenu(){$('menu').hidden=true;$('menuToggle').setAttribute('aria-expanded','false')}
$('menuToggle').addEventListener('click',function(){$('menu').hidden=!$('menu').hidden;$('menuToggle').setAttribute('aria-expanded',String(!$('menu').hidden))});
$('closeMenu').addEventListener('click',closeMenu);
$('fullscreen').addEventListener('click',function(){closeMenu();start()});
$('refresh').addEventListener('click',function(){closeMenu();updateWeather()});
function setPlain(on){$('stage').classList.toggle('plain',on);$('photoToggle').textContent=on?'Use photo clock':'Use plain clock (no photo)';fitText()}
$('photoToggle').addEventListener('click',function(){var on=!$('stage').classList.contains('plain');setPlain(on);try{localStorage.setItem('echo5_plain_v6',on?'1':'0')}catch(e){}closeMenu()});
window.addEventListener('resize',resize);
window.addEventListener('online',updateWeather);
document.addEventListener('visibilitychange',function(){if(!document.hidden){updateClock();wake();if(Date.now()-lastSuccess>REFRESH_MS)updateWeather()}});
resize();try{setPlain(localStorage.getItem('echo5_plain_v6')==='1')}catch(e){}
updateClock();updateWeather();wake();
setInterval(updateClock,1000);setInterval(updateWeather,REFRESH_MS);
})();
